<style>
:root{--ink:#20252b;--paper:#fbf8f2;--coral:#f16e57;--blue:#3159a7;--lime:#d9e76a;--lilac:#c9b9ec;--muted:#686b70;--line:#ded9d0;--serif:Georgia,serif;--sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.55}a{color:inherit}.wrap{width:min(1160px,calc(100% - 40px));margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:22px 0;border-bottom:1px solid var(--line);font-size:14px}.brand{font-weight:800;letter-spacing:-.04em;font-size:19px}.nav{display:flex;gap:22px;align-items:center}.nav a{text-decoration:none;color:var(--muted)}.lang{border:1px solid var(--ink);border-radius:99px;padding:6px 11px;background:transparent;font:inherit;font-weight:700;cursor:pointer}.hero{padding:70px 0 76px;display:grid;grid-template-columns:1.05fr .95fr;gap:42px;align-items:center}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:800;color:var(--blue)}h1{font-size:clamp(48px,7vw,88px);line-height:.98;letter-spacing:-.075em;margin:22px 0 26px;max-width:760px}h1 em{font-family:var(--serif);font-weight:400;color:var(--coral);letter-spacing:-.07em}.lead{font-size:19px;max-width:570px;color:#454950}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}.btn{display:inline-block;text-decoration:none;padding:13px 18px;border-radius:99px;background:var(--ink);color:white;font-weight:700;font-size:14px;cursor:pointer}.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--ink)}.hero-img{position:relative}.hero-img img{width:100%;height:520px;object-fit:cover;object-position:50% 35%;border-radius:48% 48% 8px 8px}.sticker{position:absolute;bottom:25px;left:-25px;background:var(--lime);padding:18px 20px;border-radius:50%;width:118px;height:118px;display:grid;place-items:center;text-align:center;font-size:12px;font-weight:800;transform:rotate(-9deg)}section{padding:82px 0;border-top:1px solid var(--line)}.section-head{display:flex;justify-content:space-between;gap:30px;align-items:end;margin-bottom:34px}.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.15em;font-weight:800;color:var(--blue)}h2{font-size:clamp(36px,5vw,58px);line-height:1;letter-spacing:-.06em;margin:10px 0 0}h2 em{font-family:var(--serif);font-weight:400;color:var(--coral)}.section-intro{max-width:410px;color:var(--muted);margin:0}.manifesto{background:var(--blue);color:white;padding:56px;border-radius:4px 80px 4px 4px;display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-bottom:32px}.manifesto h3{font-size:clamp(32px,4vw,48px);line-height:1.05;letter-spacing:-.06em;margin:0}.manifesto p{color:#e3e9f6;margin:0}.projects{display:grid;grid-template-columns:1fr 1fr;gap:18px}.project{background:white;border:1px solid var(--line);overflow:hidden;cursor:pointer;transition:transform .2s, border-color .2s}.project:hover{transform:translateY(-3px);border-color:var(--blue)}.project img{width:100%;height:260px;object-fit:cover;display:block}.project-body{padding:24px}.project small{color:var(--blue);font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:10px}.project h3{font-size:25px;letter-spacing:-.04em;margin:8px 0}.project p{color:var(--muted);margin:0 0 16px}.metric{display:flex;gap:18px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px;margin-top:16px}.metric strong{font-size:22px;display:block;letter-spacing:-.04em}.metric span{font-size:11px;color:var(--muted)}.click-hint{font-size:12px;font-weight:700;color:var(--blue);margin-top:14px;display:inline-block}.process{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:32px}.step{padding:23px 18px;border-top:4px solid var(--coral);background:#fff}.step:nth-child(2){border-color:var(--blue)}.step:nth-child(3){border-color:#a58bd5}.step:nth-child(4){border-color:#b4c43c}.step .num{font-size:12px;color:var(--muted);font-weight:800}.step h3{font-size:22px;letter-spacing:-.04em;margin:14px 0 6px}.step p{font-size:13px;color:var(--muted);margin:0}.testimonials{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.quote-card{background:white;border:1px solid var(--line);padding:26px;border-radius:4px;display:flex;flex-direction:column;justify-content:space-between}.quote-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--coral);margin-bottom:14px}.quote-card p{font-size:15px;color:var(--ink);margin:0 0 20px;font-style:italic}.quote-author{border-top:1px solid var(--line);padding-top:14px}.quote-author strong{display:block;font-size:14px}.quote-author span{font-size:12px;color:var(--muted)}.about{display:grid;grid-template-columns:.8fr 1.2fr;gap:42px;align-items:center}.about img{width:100%;height:430px;object-fit:cover}.about p{font-size:17px;color:#50545a}.tagcloud{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}.tagcloud span{border:1px solid var(--line);padding:8px 12px;border-radius:99px;font-size:13px;background:white}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:24px}.gallery img{width:100%;height:220px;object-fit:cover}.contact{background:var(--lime);padding:58px;border-radius:4px 80px 4px 4px;display:flex;justify-content:space-between;gap:25px;align-items:center}.contact h2{max-width:620px}.contact .btn{background:var(--ink)}footer{padding:25px 0;color:var(--muted);font-size:12px;display:flex;justify-content:space-between}.en{display:none}.lang-en .de{display:none}.lang-en .en{display:initial}.lang-en p.en,.lang-en div.en{display:block}.lang-en span.en{display:inline}.lang-en h1 .en,.lang-en h2 .en{display:inline}

/* MODAL / POP-UP STYLES */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(32,37,43,0.6);backdrop-filter:blur(4px);display:none;place-items:center;z-index:1000;padding:20px}.modal-overlay.active{display:grid}.modal{background:var(--paper);width:min(760px,100%);max-height:85vh;overflow-y:auto;border-radius:8px;border:1px solid var(--line);padding:40px;position:relative;box-shadow:0 20px 40px rgba(0,0,0,0.15)}.modal-close{position:absolute;top:20px;right:20px;background:var(--ink);color:white;border:none;width:36px;height:36px;border-radius:50%;font-weight:bold;cursor:pointer;display:grid;place-items:center}.modal small{color:var(--blue);font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:11px}.modal h3{font-size:32px;letter-spacing:-.04em;margin:10px 0 16px}.modal p{color:var(--muted);font-size:16px;line-height:1.6}.modal h4{font-size:18px;margin:24px 0 12px;color:var(--ink);letter-spacing:-.02em}.modal ul{margin:0 0 24px;padding-left:20px;color:var(--muted)}.modal li{margin-bottom:8px}.modal li strong{color:var(--ink)}.modal-quote{border-left:3px solid var(--coral);padding-left:16px;font-style:italic;color:var(--ink);font-size:17px;margin:24px 0 0}
